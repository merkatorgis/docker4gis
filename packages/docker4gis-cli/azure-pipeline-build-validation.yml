trigger:
- none

pr:
  branches:
    include:
    - master
  paths:
    include:
    - packages/docker4gis-cli/**

steps:
# Shallow checkout is sufficient for BV and avoids persisting credentials.
- checkout: self
  fetchDepth: 1
  sparseCheckoutDirectories: packages/docker4gis-cli
  displayName: Git checkout

# Pin the same toolchain the CI pipeline publishes with, so the tests run
# against the Node and npm that produce the release.
- task: NodeTool@0
  inputs:
    versionSpec: '24.x'
  displayName: 'use Node 24'

- bash: |
    npm install --global npm@^11.15.0
    node --version
    npm --version
  displayName: 'pin npm'

# Run the CLI test suite.
- bash: |
    npm test
  displayName: run tests
  workingDirectory: packages/docker4gis-cli

# Build the package image.
- bash: |
    ./build.sh
  displayName: 'build package image'
  workingDirectory: packages/docker4gis-cli/base/package
